name: lessons.json guard
on:
  push:
    branches: [main]
    paths: ['lessons.json']
  pull_request:
    paths: ['lessons.json']
permissions:
  contents: write
concurrency:
  group: lessons-guard
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}
      - name: Check lessons.json against base
        id: check
        run: |
          BASE='${{ github.event.pull_request.base.sha || github.event.before }}'
          # Fails on invalid JSON, placeholder text, schema errors, or fewer
          # lessons than the base / last good version (scripts/guard-lessons.js).
          node scripts/guard-lessons.js check "${BASE:--}"
      - name: Auto-restore last good lessons.json on main
        if: failure() && github.event_name == 'push'
        run: |
          # Last good list plus any valid new lesson; re-checked before commit.
          node scripts/guard-lessons.js restore '${{ github.event.before }}' '${{ github.sha }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add lessons.json
          git commit -m "Auto-restore lessons.json after bad push ${{ github.sha }}"
          git push origin HEAD:main
          echo "::error::lessons.json push ${{ github.sha }} was invalid and has been auto-restored"
          exit 1
