name: lessons.json guard
on:
  push:
    branches: [main]
    paths: ['lessons.json']
  pull_request:
    paths: ['lessons.json']
permissions:
  contents: write
concurrency:
  group: lessons-guard
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}
      - name: Check lessons.json against base
        id: check
        run: |
          BASE='${{ github.event.pull_request.base.sha || github.event.before }}'
          if git cat-file -e "$BASE:lessons.json" 2>/dev/null; then
            git show "$BASE:lessons.json" > /tmp/base.json
            node scripts/check-lessons.js /tmp/base.json
          else
            node scripts/check-lessons.js
          fi
      - name: Auto-restore last good lessons.json on main
        if: failure() && github.event_name == 'push'
        run: |
          node scripts/restore-lessons.js '${{ github.event.before }}' '${{ github.sha }}'
          git show '${{ github.event.before }}:lessons.json' > /tmp/base.json 2>/dev/null || true
          node scripts/check-lessons.js /tmp/base.json || node scripts/check-lessons.js
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add lessons.json
          git commit -m "Auto-restore lessons.json after bad push ${{ github.sha }}"
          git push origin HEAD:main
          echo "::error::lessons.json push ${{ github.sha }} was invalid and has been auto-restored"
          exit 1
