<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warrior's Lesson">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Daily Warrior's Lesson</title>
<style>
  :root { --bg:#0B0D10; --surface:#1B2028; --ink:#E7E9EC; --muted:#9AA3AD; --accent:#FF6A1A; --line:#2a313c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 64px; }
  .brand { font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .date { font-size:13px; color:var(--muted); margin-bottom:18px; }
  h1 { font-size:26px; font-weight:700; line-height:1.2; margin-bottom:18px; }
  .art-frame { width:100%; margin:0 0 22px; border-radius:6px; overflow:hidden; background:#111; }
  .art-frame img { width:100%; height:auto; display:block; }
  .label { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin:22px 0 6px; }
  .quote { font-size:18px; font-style:italic; color:var(--ink); border-left:3px solid var(--accent); padding:4px 0 4px 16px; margin-bottom:18px; }
  .body { font-size:16px; color:#d4cfc4; }
  .today { margin-top:22px; padding:16px; border:1px solid var(--line); border-radius:6px; background:var(--surface); }
  .today b { color:var(--accent); }
  .aimed { font-size:12px; color:var(--accent); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px; }
  .hidden { display:none; }
  .nav-row { display:flex; gap:18px; flex-wrap:wrap; margin-top:24px; }
  .archive { color:var(--accent); text-decoration:none; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; }
  .archive:hover { text-decoration:underline; }
  .footer { margin-top:28px; font-size:13px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Daily Warrior's Lesson</div>
    <div class="date" id="date">Loading…</div>
    <h1 id="title">—</h1>
    <div class="aimed hidden" id="aimed"></div>
    <div class="art-frame" id="art"></div>
    <div class="label">Source</div>
    <div class="body" id="source">—</div>
    <div class="label">Quote</div>
    <div class="quote" id="quote">—</div>
    <div class="label">Lesson</div>
    <div class="body" id="lesson">—</div>
    <div class="today" id="today"></div>
    <div class="nav-row">
      <a class="archive" href="./forge.html">The Forge — personalize your path →</a>
      <a class="archive" href="./archive.html">Archive →</a>
    </div>
    <div class="footer">When the game is over, the king and the pawn go back into the same box.</div>
  </div>
<script>
  const DEFAULT_LESSON = {
    date: "2026-08-31",
    title: "The Obstacle Becomes the Way",
    image: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Pietro_da_Cortona_-_Battle_of_Alexander_versus_Darius_-_Google_Art_Project.jpg",
    imageAlt: "Battle of Alexander versus Darius — full landscape painting by Pietro da Cortona",
    fallback: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Pietro_da_Cortona_-_Battle_of_Alexander_versus_Darius_-_Google_Art_Project.jpg/1280px-Pietro_da_Cortona_-_Battle_of_Alexander_versus_Darius_-_Google_Art_Project.jpg",
    source: "Marcus Aurelius, Meditations 5.20 (Gregory Hays translation)",
    quote: "The impediment to action advances action. What stands in the way becomes the way.",
    lesson: "Trials forge the warrior, Chief. Marcus wrote under the weight of empire, plague, and endless frontier pressure. He refused to treat the obstacle as interruption. The mind converts what blocks into the very path forward. Strategy over raw strength begins when you stop cursing the rock and start using it as footing. Armor and appearance are not the thing—your judgment of the impediment is.",
    today: "Name one concrete impediment facing you before noon. Convert it: how does this advance the action you actually need?",
    lanes: ["thinker","warrior"]
  };
  const LANE_LABEL = {warrior:'Warrior',thinker:'Thinker',builder:'Builder',power:'Power',faith:'Faith',odyssey:'Odyssey'};

  function hashStamp(stamp) {
    var n = 0;
    for (var i = 0; i < stamp.length; i++) n = (n * 31 + stamp.charCodeAt(i)) >>> 0;
    return n;
  }

  function pickPersonalized(lessons, forged, stamp) {
    if (!forged || !forged.primary) return null;
    var primary = lessons.filter(function(l){ return l.lanes && l.lanes.indexOf(forged.primary) !== -1; });
    var secondary = lessons.filter(function(l){ return l.lanes && forged.secondary && l.lanes.indexOf(forged.secondary) !== -1; });
    var pool = (hashStamp(stamp) % 10 < 7 ? primary : secondary);
    if (!pool.length) pool = primary.length ? primary : secondary;
    if (!pool.length) return null;
    return pool[hashStamp(stamp + (forged.primary || '')) % pool.length];
  }

  function render(LESSON, aimed) {
    document.getElementById('date').textContent = LESSON.date;
    document.getElementById('title').textContent = LESSON.title;
    if (LESSON.image) {
      document.getElementById('art').innerHTML =
        '<img src="' + LESSON.image + '" alt="' + (LESSON.imageAlt || '') + '" referrerpolicy="no-referrer" decoding="async" style="width:100%;height:auto;display:block" onerror="this.onerror=null;this.src=\'' + (LESSON.fallback || '') + '\';">';
    } else {
      document.getElementById('art').innerHTML = '';
    }
    document.getElementById('source').textContent = LESSON.source;
    document.getElementById('quote').textContent = LESSON.quote;
    document.getElementById('lesson').textContent = LESSON.lesson;
    document.getElementById('today').innerHTML = '<b>Today:</b> ' + LESSON.today;
    var el = document.getElementById('aimed');
    if (aimed) {
      el.textContent = 'Aimed at ' + aimed + ' — your Forged path';
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  const params = new URLSearchParams(window.location.search);
  var forged = null;
  try { forged = JSON.parse(localStorage.getItem('forged_path')); } catch(e){}

  fetch('lessons.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      const lessons = data.lessons || [];
      var lesson = DEFAULT_LESSON;
      var aimed = null;
      if (params.get('date')) {
        var found = lessons.find(function (l) { return l.date === params.get('date'); });
        if (found) lesson = found;
      } else if (forged && forged.primary) {
        aimed = LANE_LABEL[forged.primary] + (forged.secondary ? ' / ' + LANE_LABEL[forged.secondary] : '');
        var picked = pickPersonalized(lessons, forged, new Date().toISOString().slice(0,10));
        lesson = picked || lessons[0] || DEFAULT_LESSON;
      } else if (lessons.length) {
        lesson = lessons.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); })[0];
      }
      render(lesson, aimed);
    })
    .catch(function () { render(DEFAULT_LESSON, forged && forged.primary ? LANE_LABEL[forged.primary] : null); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (r) { return r.unregister(); }));
    }).then(function () {
      return caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      });
    }).then(function () {
      return navigator.serviceWorker.register('sw.js?v=8');
    }).catch(function () {});
  }
</script>
</body>
</html>
