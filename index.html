<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warrior's Lesson">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Daily Warrior's Lesson</title>
<style>
  :root { --bg:#0a0a0a; --ink:#e8e4dc; --muted:#8a8478; --accent:#c9a227; --line:#2a2a2a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 64px; }
  .brand { font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .date { font-size:13px; color:var(--muted); margin-bottom:18px; }
  h1 { font-size:26px; font-weight:700; line-height:1.2; margin-bottom:18px; }
  .art-frame { width:100%; margin:0 0 22px; border-radius:10px; overflow:hidden; background:#111; }
  .art-frame img { width:100%; height:auto; display:block; }
  .label { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin:22px 0 6px; }
  .quote { font-size:18px; font-style:italic; color:var(--ink); border-left:3px solid var(--accent); padding:4px 0 4px 16px; margin-bottom:18px; }
  .body { font-size:16px; color:#d4cfc4; }
  .today { margin-top:22px; padding:16px; border:1px solid var(--line); border-radius:10px; background:#121212; }
  .today b { color:var(--accent); }
  .archive { display:inline-block; margin-top:24px; color:var(--accent); text-decoration:none; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; }
  .archive:hover { text-decoration:underline; }
  .footer { margin-top:28px; font-size:13px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Daily Warrior's Lesson</div>
    <div class="date" id="date">Loading…</div>
    <h1 id="title">—</h1>
    <div class="art-frame" id="art"></div>
    <div class="label">Source</div>
    <div class="body" id="source">—</div>
    <div class="label">Quote</div>
    <div class="quote" id="quote">—</div>
    <div class="label">Lesson</div>
    <div class="body" id="lesson">—</div>
    <div class="today" id="today"></div>
    <a class="archive" href="./archive.html">View previous lessons →</a>
    <div class="footer">When the game is over, the king and the pawn go back into the same box.</div>
  </div>
<script>
  const DEFAULT_LESSON = {
    date: "2026-08-29",
    title: "The Obstacle Becomes the Way",
    image: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Pietro_da_Cortona_-_Battle_of_Alexander_versus_Darius_-_Google_Art_Project.jpg",
    imageAlt: "Battle of Alexander versus Darius — full landscape painting, Capitoline Museums",
    fallback: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Pietro_da_Cortona_-_Battle_of_Alexander_versus_Darius_-_Google_Art_Project.jpg/1280px-Pietro_da_Cortona_-_Battle_of_Alexander_versus_Darius_-_Google_Art_Project.jpg",
    source: "Marcus Aurelius, Meditations 5.20 (Hays translation)",
    quote: "The impediment to action advances action. What stands in the way becomes the way.",
    lesson: "Trials do not merely test the warrior—they forge him. The obstacle is never pure interruption; it is raw material. Marcus, writing from the frontier while commanding legions, understood that adaptation converts resistance into propulsion. Strategy over raw strength: the mind that refuses to treat the block as final turns it into the next step of the path.",
    today: "When the first friction appears—delay, resistance, unexpected demand—pause once. Ask only: how does this advance the mission? Then move."
  };

  function render(LESSON) {
    document.getElementById('date').textContent = LESSON.date;
    document.getElementById('title').textContent = LESSON.title;
    document.getElementById('art').innerHTML =
      '<img src="' + LESSON.image + '" alt="' + LESSON.imageAlt + '" referrerpolicy="no-referrer" decoding="async" style="width:100%;height:auto;display:block" onerror="this.onerror=null;this.src=\'' + LESSON.fallback + '\';">';
    document.getElementById('source').textContent = LESSON.source;
    document.getElementById('quote').textContent = LESSON.quote;
    document.getElementById('lesson').textContent = LESSON.lesson;
    document.getElementById('today').innerHTML = '<b>Today:</b> ' + LESSON.today;
  }

  const params = new URLSearchParams(window.location.search);
  const requestedDate = params.get('date');

  fetch('lessons.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      const lessons = data.lessons || [];
      let lesson = DEFAULT_LESSON;
      if (requestedDate) {
        const found = lessons.find(function (l) { return l.date === requestedDate; });
        if (found) lesson = found;
      } else if (lessons.length) {
        lesson = lessons.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); })[0];
      }
      render(lesson);
    })
    .catch(function () {
      render(DEFAULT_LESSON);
    });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (r) { return r.unregister(); }));
    }).then(function () {
      return caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      });
    }).then(function () {
      return navigator.serviceWorker.register('sw.js?v=5');
    }).catch(function () {});
  }
</script>
</body>
</html>
