<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warrior's Lesson">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Daily Warrior's Lesson</title>
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #e8e4dc;
    --muted: #8a8478;
    --accent: #c9a227;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .date {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }
  .art-frame {
    width: 100%;
    margin: 0 0 22px;
    border-radius: 10px;
    overflow: hidden;
    background: #111;
  }
  .art-frame img {
    width: 100%;
    height: auto;
    display: block;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 6px;
  }
  .quote {
    font-size: 18px;
    font-style: italic;
    color: var(--ink);
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 16px;
    margin-bottom: 18px;
  }
  .body { font-size: 16px; color: #d4cfc4; }
  .body p { margin-bottom: 12px; }
  .today {
    margin-top: 22px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #121212;
  }
  .today b { color: var(--accent); }
  .footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Daily Warrior's Lesson</div>
    <div class="date" id="date">Loading…</div>
    <h1 id="title">—</h1>
    <div class="art-frame" id="art"></div>
    <div class="label">Source</div>
    <div class="body" id="source">—</div>
    <div class="label">Quote</div>
    <div class="quote" id="quote">—</div>
    <div class="label">Lesson</div>
    <div class="body" id="lesson">—</div>
    <div class="today" id="today"></div>
    <div class="footer">When the game is over, the king and the pawn go back into the same box.</div>
  </div>
<script>
  // Today's lesson is injected here by the automation each morning.
  // The image is rendered at full width with height:auto so the ENTIRE
  // picture is always visible — never cropped, never in a fixed banner.
  const LESSON = {
    date: "2026-08-28",
    title: "The Battle Is the Lord's",
    image: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Battle_of_David_and_Goliath_by_Daniele_da_Volterra_in_Louvre.jpg",
    imageAlt: "David and Goliath by Daniele da Volterra — full painting, Louvre",
    source: "1 Samuel 17:45-47",
    quote: "Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts… for the battle is the LORD's.",
    lesson: "Goliath was a giant in armor and reputation. David was a shepherd with a sling. The army saw size and trembled. David saw defiance against the living God and remembered the lion and the bear. Faith doesn't deny the giant — it refuses to let the giant set the terms.",
    today: "Name your Goliath. Don't match it with borrowed armor. Stand in what God has already proven in you."
  };

  document.getElementById('date').textContent = LESSON.date;
  document.getElementById('title').textContent = LESSON.title;
  document.getElementById('art').innerHTML = '<img src="' + LESSON.image + '" alt="' + LESSON.imageAlt + '" loading="eager">';
  document.getElementById('source').textContent = LESSON.source;
  document.getElementById('quote').textContent = LESSON.quote;
  document.getElementById('lesson').textContent = LESSON.lesson;
  document.getElementById('today').innerHTML = '<b>Today:</b> ' + LESSON.today;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
