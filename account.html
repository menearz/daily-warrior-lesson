<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="./favicon.ico" sizes="any">
<title>Account — Daily Warrior&#39;s Lesson</title>
<style>
  :root { --bg:#0B0D10; --surface:#1B2028; --ink:#E7E9EC; --muted:#9AA3AD; --accent:#FF6A1A; --line:#2a313c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
  .wrap { max-width:560px; margin:0 auto; padding:28px 20px 64px; }
  .brand { font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  h1 { font-size:26px; line-height:1.2; margin-bottom:12px; }
  p { margin-bottom:12px; color:#d4cfc4; }
  .muted { color:var(--muted); font-size:14px; }
  label { display:block; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
  input[type=email] { width:100%; padding:12px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  button, .btn { display:inline-block; margin-top:14px; padding:12px 18px; font-size:15px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#0B0D10; font-weight:700; cursor:pointer; text-decoration:none; }
  button.ghost, .btn.ghost { background:transparent; color:var(--accent); }
  .card { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:16px; margin-top:14px; }
  .notice { border:1px dashed var(--accent); color:var(--accent); border-radius:6px; padding:10px 12px; font-size:13px; margin:14px 0; }
  .err { color:#ff8a7a; margin-top:10px; }
  .hidden { display:none !important; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .nav { margin-top:28px; display:flex; gap:18px; flex-wrap:wrap; }
  .nav a { color:var(--accent); text-decoration:none; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; }
  .lang { margin-top:24px; font-size:13px; }
  .pf fieldset { border:0; }
  .pf .themes { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  .pf .themes label { margin:0; display:flex; align-items:center; gap:10px; min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; font-size:15px; letter-spacing:0; text-transform:none; color:var(--ink); cursor:pointer; }
  .pf .themes input { width:20px; height:20px; accent-color:var(--accent); }
  .pf select, .pf input[type=time] { width:100%; min-height:44px; padding:10px 12px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .pf button[type=submit] { width:100%; min-height:48px; }
  @media (max-width:380px) { .pf .themes { grid-template-columns:1fr; } .wrap { padding:20px 14px 48px; } }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; border:1px solid var(--accent); color:var(--accent); font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:10px; }
  .lang button { margin:0 6px 0 0; padding:6px 10px; font-size:13px; background:transparent; color:var(--ink); border-color:var(--line); font-weight:400; }
</style>
<script src="config.js"></script>
<style>html:not(.dw-accounts-open) body[data-account-page] .wrap{display:none}</style>
</head>
<body data-account-page>
<div class="wrap">
  <div class="brand">Daily Warrior&#39;s Lesson</div>
  <section id="confirm" class="hidden card">
    <h1 data-k="confirmTitle"></h1>
    <p id="confirm-body"></p>
    <a class="btn" href="./index.html" data-k="seeToday"></a>
    <p class="muted" style="margin-top:10px" data-k="confirmSmall"></p>
  </section>
  <section id="signed-out" class="hidden"><h1 data-k="account"></h1><a class="btn" href="./signin.html" data-k="signIn"></a></section>
  <section id="signed-in" class="hidden">
    <h1 data-k="account"></h1>
    <p id="who"></p>
    <span class="badge hidden" id="tester-badge" data-k="testerBadge"></span>
    <div class="card">
      <p id="plan-line"></p>
      <div class="row">
        <button type="button" id="manage" class="hidden" data-k="manage"></button>
        <a class="btn hidden" id="choose" href="./plans.html" data-k="choosePlan"></a>
      </div>
      <p class="muted" id="sync-line"></p>
    </div>
    <form class="card pf" id="profile-form" novalidate>
      <h2 style="font-size:18px;margin-bottom:6px" data-pk="title"></h2>
      <p class="muted hidden" id="pf-plan" data-pk="needsPlan"></p>
      <p class="muted" data-pk="email"></p>
      <fieldset><legend style="font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px" data-pk="themes"></legend><div class="themes" id="pf-themes"></div></fieldset>
      <label for="pf-lang" data-pk="lang"></label>
      <select id="pf-lang"><option value="en">English</option><option value="es">Español</option></select>
      <label for="pf-time" data-pk="time"></label>
      <input type="time" id="pf-time" step="60" required>
      <label for="pf-zone" data-pk="zone"></label>
      <select id="pf-zone"></select>
      <button type="submit" data-pk="save"></button>
      <p class="muted" id="pf-msg" role="status" aria-live="polite"></p>
    </form>
    <div class="card">
      <p data-k="deleteLine"></p>
      <button type="button" class="ghost" id="delete" data-k="deleteBtn"></button>
    </div>
    <button type="button" class="ghost" id="signout" data-k="signOut"></button>
  </section>
  <div class="err" id="acct-err" role="alert"></div>
  <div class="nav"><a href="./index.html" data-k="seeToday">Today</a><a href="./account.html" data-k="account">Account</a><a href="./privacy.html">Privacy</a></div>
  <div class="lang"><button type="button" data-set-lang="en">English</button><button type="button" data-set-lang="es">Español</button></div>
</div>
<script src="account-client.js"></script>
<script>
  var LANG = (function () { try { var l = localStorage.getItem("dw-lang"); return l === "es" ? "es" : "en"; } catch (e) { return "en"; } })();
  var DW = DWAccount.create({ storage: window.localStorage, fetch: window.fetch.bind(window), apiBase: window.DW_API_BASE });
  function paintText() {
    document.documentElement.lang = LANG;
    var n = document.querySelectorAll("[data-k]");
    for (var i = 0; i < n.length; i++) n[i].textContent = DW.t(LANG, n[i].getAttribute("data-k"));
    var p = document.querySelectorAll("[data-kp]");
    for (var j = 0; j < p.length; j++) p[j].setAttribute("placeholder", DW.t(LANG, p[j].getAttribute("data-kp")));
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-set-lang]");
    if (!b) return;
    LANG = b.getAttribute("data-set-lang");
    try { localStorage.setItem("dw-lang", LANG); } catch (err) {}
    paintText(); if (window.onLang) window.onLang();
    if (DW.signedIn()) DW.setLang(LANG).catch(function () {});
  });
  function show(id, on) { document.getElementById(id).classList.toggle("hidden", !on); }
  function err(id, key, vars) { var el = document.getElementById(id); el.textContent = key ? DW.t(LANG, key, vars) : ""; }
</script>
<script>
  var ME = null;
  function fmtDate(ms) { try { return new Date(ms).toLocaleDateString(LANG === "es" ? "es" : "en-US", { year: "numeric", month: "long", day: "numeric" }); } catch (e) { return ""; } }
  function paintMe() {
    paintText();
    if (!ME) return;
    document.getElementById("who").textContent = DW.t(LANG, "signedInAs", { email: ME.email });
    var plan = ME.plan || {}; var name = DW.t(LANG, plan.interval === "yearly" ? "yearlyName" : "monthlyName");
    var free = ME.entitledVia === "tester" || ME.entitledVia === "owner";
    show("tester-badge", ME.entitledVia === "tester");
    var line = free ? DW.t(LANG, "freeAccess") : !ME.entitled ? DW.t(LANG, "noPlan")
      : plan.cancelAtPeriodEnd ? DW.t(LANG, "planEnds", { date: fmtDate(plan.currentPeriodEnd) })
      : DW.t(LANG, "planRow", { plan: name, date: plan.currentPeriodEnd ? fmtDate(plan.currentPeriodEnd) : "—" });
    document.getElementById("plan-line").textContent = line;
    show("manage", !free && Boolean(ME.entitled || plan.status === "past_due")); show("choose", !ME.entitled);
    document.getElementById("sync-line").textContent = DW.t(LANG, ME.entitled ? "synced" : "syncNeedsPlan");
    if (/checkout=success/.test(location.search) && ME.entitled) {
      var fp = ME.forgedPath || {};
      document.getElementById("confirm-body").textContent = DW.t(LANG, "confirmBody", { plan: name, primary: DW.laneName(LANG, fp.primary), secondary: DW.laneName(LANG, fp.secondary), email: ME.email });
      show("confirm", true);
    }
  }
  var PROF = null;
  function pt(k) { return DWAccount.PROFILE_T[LANG][k]; }
  function paintProfile() {
    var n = document.querySelectorAll("[data-pk]");
    for (var i = 0; i < n.length; i++) n[i].textContent = pt(n[i].getAttribute("data-pk"));
    var box = document.getElementById("pf-themes"); box.textContent = "";
    var chosen = (PROF && PROF.themes) || [];
    DWAccount.LANES.forEach(function (l) {
      var lab = document.createElement("label"); var cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = l; cb.name = "theme"; cb.checked = chosen.indexOf(l) >= 0;
      lab.appendChild(cb); lab.appendChild(document.createTextNode(DW.laneName(LANG, l))); box.appendChild(lab);
    });
    if (!PROF) return;
    document.getElementById("pf-lang").value = PROF.lang || LANG;
    document.getElementById("pf-time").value = PROF.deliveryTime || "06:40";
    var zone = document.getElementById("pf-zone");
    if (!zone.options.length) DWAccount.timezones().forEach(function (z) { var o = document.createElement("option"); o.value = z; o.textContent = z.replace(/_/g, " "); zone.appendChild(o); });
    var guess = ""; try { guess = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    zone.value = PROF.timezone || guess || "UTC";
    document.getElementById("pf-plan").classList.toggle("hidden", Boolean(PROF.entitled));
  }
  document.getElementById("pf-themes").addEventListener("change", function (e) {
    var on = document.querySelectorAll("#pf-themes input:checked");
    if (on.length > 3) { e.target.checked = false; document.getElementById("pf-msg").textContent = pt("tooMany"); }
  });
  document.getElementById("profile-form").onsubmit = function (e) {
    e.preventDefault();
    var themes = Array.prototype.map.call(document.querySelectorAll("#pf-themes input:checked"), function (c) { return c.value; });
    var body = { themes: themes, lang: document.getElementById("pf-lang").value, deliveryTime: document.getElementById("pf-time").value, timezone: document.getElementById("pf-zone").value };
    var bad = DWAccount.validateProfile(body); var msg = document.getElementById("pf-msg");
    if (bad) { msg.textContent = pt(bad); return; }
    DW.saveProfile(body).then(function (r) {
      if (r.status !== 200) { msg.textContent = pt("failed"); return; }
      PROF = r.data; msg.textContent = pt("saved");
      if (body.lang !== LANG) { LANG = body.lang; try { localStorage.setItem("dw-lang", LANG); } catch (x) {} paintMe(); }
    }).catch(function () { msg.textContent = pt("failed"); });
  };
  window.onLang = function () { paintMe(); paintProfile(); };
  function load() {
    if (!DW.signedIn()) { paintText(); show("signed-out", true); return; }
    DW.sync().then(function (r) { return r.status === 200 ? r : DW.me(); }).then(function (r) {
      if (r.status !== 200) { show("signed-out", true); paintText(); return; }
      ME = r.data; show("signed-in", true); paintMe();
      DW.profile().then(function (p) { if (p.status === 200) PROF = p.data; paintProfile(); }).catch(function () { paintProfile(); });
    }).catch(function () { paintText(); err("acct-err", "network"); });
  }
  document.getElementById("manage").onclick = function () { DW.portal().then(function (r) { if (r.data && r.data.url) location.href = r.data.url; else err("acct-err", "network"); }).catch(function () { err("acct-err", "network"); }); };
  document.getElementById("delete").onclick = function () { if (!confirm(DW.t(LANG, "deleteConfirm"))) return; DW.remove().then(function () { location.replace("./index.html"); }); };
  document.getElementById("signout").onclick = function () { DW.signOut().then(function () { location.replace("./index.html"); }); };
  load();
</script>
</body>
</html>
