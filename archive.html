<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warrior's Lesson">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Previous Lessons — Daily Warrior's Lesson</title>
<style>
  :root { --bg:#0a0a0a; --ink:#e8e4dc; --muted:#8a8478; --accent:#c9a227; --line:#2a2a2a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 64px; }
  .brand { font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .back { display:inline-block; margin:0 0 18px; color:var(--muted); text-decoration:none; font-size:14px; }
  .back:hover { color:var(--accent); }
  h1 { font-size:24px; font-weight:700; margin-bottom:18px; }
  .list { display:flex; flex-direction:column; gap:12px; }
  a.item {
    display:block; text-decoration:none; color:var(--ink);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#121212;
  }
  a.item:hover { border-color:var(--accent); }
  .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#111; }
  .meta { padding:14px 16px 16px; }
  .d { font-size:12px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px; }
  .t { font-size:18px; font-weight:700; margin-bottom:6px; }
  .s { font-size:14px; color:#d4cfc4; }
  .empty { color:var(--muted); font-size:15px; }
  .footer { margin-top:28px; font-size:13px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Daily Warrior's Lesson</div>
    <a class="back" href="./" aria-label="Back to today's lesson">← Today's lesson</a>
    <h1>Previous Lessons</h1>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
    <div class="footer">When the game is over, the king and the pawn go back into the same box.</div>
  </div>
<script>
  fetch('lessons.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var list = document.getElementById('list');
      var lessons = (data.lessons || []).slice().sort(function (a, b) {
        return (b.date || '').localeCompare(a.date || '');
      });
      if (!lessons.length) {
        list.innerHTML = '<div class="empty">No previous lessons yet.</div>';
        return;
      }
      list.innerHTML = lessons.map(function (l) {
        var img = l.image || l.fallback || '';
        var alt = l.imageAlt || l.title || 'Lesson image';
        return '<a class="item" href="./index.html?date=' + encodeURIComponent(l.date) + '">' +
          '<img class="thumb" src="' + img + '" alt="' + alt + '" referrerpolicy="no-referrer" decoding="async" onerror="this.style.display=\'none\'">' +
          '<div class="meta">' +
          '<div class="d">' + (l.date || '') + '</div>' +
          '<div class="t">' + (l.title || 'Untitled lesson') + '</div>' +
          '<div class="s">' + (l.source || '') + '</div>' +
          '</div></a>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('list').innerHTML = '<div class="empty">Could not load the archive.</div>';
    });
</script>
</body>
</html>
